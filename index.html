<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教學進度時間表管理系統</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--pri:#58a6ff;--glow:0 0 10px rgba(88,166,255,.4);--tx:#c9d1d9;--mut:#8b949e;--dng:#ff7b72;--dngbg:rgba(255,123,114,.1);--wrn:#e3b341;--inp:#010409;--ok:#3fb950}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:20px;line-height:1.6;color-scheme:dark;background-image:radial-gradient(circle at top,#1f242c 0%,transparent 40%)}
.container{max-width:1000px;margin:0 auto}
h1{text-align:center;margin:0 0 10px;font-weight:800;background:linear-gradient(90deg,#58a6ff,#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
h2{font-size:1.2rem;margin-top:0;color:#f0f6fc;border-bottom:2px solid var(--pri);padding-bottom:5px;display:inline-block}
#sync{text-align:center;font-size:.85rem;margin-bottom:20px;color:var(--mut)}
#sync.ok{color:var(--ok)}#sync.err{color:var(--dng);font-weight:bold}
.card{background:var(--card);padding:20px;border-radius:12px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.5);margin-bottom:25px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.input-group{margin-bottom:15px}
label{display:block;font-weight:bold;margin-bottom:6px;font-size:.9rem;color:var(--mut)}
input[type=date],input[type=text]{width:100%;padding:10px;background:var(--inp);border:1px solid var(--bd);color:var(--tx);border-radius:6px}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:var(--glow)}
button{background:transparent;color:var(--pri);border:1px solid var(--pri);padding:8px 15px;border-radius:6px;cursor:pointer;transition:.2s;font-size:14px;font-weight:bold}
button:hover{background:var(--pri);color:#000;box-shadow:var(--glow)}
.btn-danger{color:var(--dng);border-color:var(--dng);padding:4px 10px;font-size:.8rem}
.btn-danger:hover{background:var(--dng);box-shadow:none}
.btn-edit{color:var(--wrn);border-color:var(--wrn);padding:4px 10px;font-size:.8rem;margin-right:5px}
.btn-edit:hover{background:var(--wrn);box-shadow:none}
.btn-cancel{color:var(--mut);border-color:var(--mut)}
.btn-cancel:hover{background:var(--mut);box-shadow:none}
.btn-sm{padding:4px 10px;font-size:.75rem}
.holiday-tag{display:inline-block;background:rgba(210,168,255,.1);color:#d2a8ff;padding:5px 12px;border-radius:20px;font-size:13px;margin:4px;border:1px solid #d2a8ff}
.x{cursor:pointer;color:var(--dng);font-weight:bold;margin-left:6px}
.day-selector{background:rgba(1,4,9,.5);padding:15px;border-radius:6px;border:1px solid var(--bd)}
.day-row{display:flex;align-items:center;margin-bottom:10px}
.day-row label{width:85px;margin:0;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--tx)}
.day-row input[type=text]{flex:1;padding:6px 10px}
.class-timetable{margin-bottom:20px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--inp)}
.class-header{background:linear-gradient(180deg,#161b22,#0d1117);padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);cursor:pointer}
.class-header h3{margin:0;color:#f0f6fc;font-size:1.3rem}
.info{font-size:.9rem;color:var(--mut);margin:6px 0 0 28px}
.ico{color:var(--pri);display:inline-block;width:16px;text-align:center}
.badge{background:rgba(88,166,255,.15);color:var(--pri);padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:bold;display:inline-block;border:1px solid var(--pri)}
.badge.h{background:var(--dngbg);color:var(--dng);border-color:var(--dng)}
table{width:100%;border-collapse:collapse}
th,td{padding:15px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:rgba(22,27,34,.8);color:var(--mut);width:40%;font-size:.85rem}
th.date-cell,td.date-cell{width:20%;white-space:nowrap}
.date-cell{font-weight:bold;color:var(--pri)}
.date-past{color:#484f58}
.cell-note{font-size:.8rem;color:#a371f7;background:rgba(163,113,247,.1);padding:2px 8px;border-radius:4px;display:inline-block;border:1px solid rgba(163,113,247,.3)}
.row-holiday{background:var(--dngbg)!important;border-left:3px solid var(--dng)}
.tag-off{background:var(--dng);color:#000;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:8px;font-weight:bold}
.past-divider{cursor:pointer}
.past-divider td{text-align:center;background:rgba(22,27,34,.4);color:var(--mut);letter-spacing:2px;border-top:1px dashed var(--bd)}
.content-display{background:rgba(13,17,23,.6);border:1px dashed var(--bd);border-radius:4px;padding:12px;min-height:24px;white-space:pre-wrap;color:#e6edf3;font-family:Consolas,monospace;margin-bottom:8px}
.input-seamless{width:100%;border:1px solid var(--pri);background:var(--inp);padding:10px;border-radius:6px;color:var(--tx);font-family:inherit;resize:vertical;min-height:80px;margin-bottom:8px}
.r{text-align:right}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}th,td{padding:10px}.class-header{flex-direction:column;align-items:flex-start;gap:12px}}
</style>
</head>
<body>
<div class="container">
  <h1>SYNC// CLASS TRACKER</h1>
  <div id="sync">連線中…</div>

  <div class="grid-2">
    <div class="card">
      <h2>1. 學期與段考區間</h2>
      <div class="input-group"><label>紀錄起始日 (學期開始)</label><input type="date" id="startDate" onchange="saveConfig()"></div>
      <div class="input-group"><label>下次段考日 (紀錄結束)</label><input type="date" id="examDate" onchange="saveConfig()"></div>
      <hr style="border:0;border-top:1px dashed var(--bd);margin:20px 0">
      <h2>2. 停課/放假日登記</h2>
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <input type="date" id="holidayInput" style="flex:1">
        <input type="text" id="holidayReason" placeholder="原因(如:校慶)" style="flex:1.5">
        <button onclick="addHoliday()">登記</button>
      </div>
      <div id="holidayList"></div>
    </div>

    <div class="card" id="editorCard">
      <h2>3. 班級設定 / 排課</h2>
      <div class="input-group"><label>班級名稱</label><input type="text" id="className" placeholder="例如：101班"></div>
      <div class="input-group"><label>上課星期與備註 (可複選)</label>
        <div class="day-selector" id="dayBox"></div>
      </div>
      <div style="display:flex;gap:10px">
        <button id="submitClassBtn" onclick="submitClass()" style="flex:1;padding:12px">+ 新增班級</button>
        <button id="cancelEditBtn" class="btn-cancel" onclick="cancelEdit()" style="display:none;padding:12px">取消編輯</button>
      </div>
    </div>
  </div>

  <h2 style="font-size:1.5rem">📖 班級進度資料庫</h2>
  <div id="timetablesContainer" style="margin-top:15px"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, updateDoc, deleteField, onSnapshot }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3ppRnqqsDAr6GrbGb1dogyAYFKRDtEQY",
  authDomain: "class-progress-tracker-1afd6.firebaseapp.com",
  projectId: "class-progress-tracker-1afd6",
  storageBucket: "class-progress-tracker-1afd6.firebasestorage.app",
  messagingSenderId: "814213770967",
  appId: "1:814213770967:web:efea063b543db888de8a92"
};

const app = initializeApp(firebaseConfig);
// 離線快取：斷線時仍可編輯，連線後自動同步
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const dbRef = doc(db, "tracker", "mainData");

const $ = id => document.getElementById(id);
const dayNames = ['日','一','二','三','四','五','六'];
let config = { startDate:'', examDate:'', holidays:[] };
let classes = [], records = {};
let editingClassId = null;
const expanded = new Set(), expandedPast = new Set(), openEdits = new Set();
let pendingRender = false;

const esc = s => String(s ?? '').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ---------- 同步狀態 ----------
function setStatus(cls, msg){ const e=$('sync'); e.className=cls; e.textContent=msg; }
let syncErr = false;
function errMsg(err){
  syncErr = true;
  console.error('Firebase 錯誤:', err);
  const hints = {
    'permission-denied':'權限被拒：請到 Firebase Console → Firestore → 規則 開放讀寫',
    'not-found':'找不到資料庫：請先在 Firebase 建立 Firestore Database',
    'unavailable':'無法連線到 Firebase，請檢查網路'
  };
  setStatus('err', '✕ 同步失敗：' + (hints[err.code] || err.code || err.message));
}
function write(p){
  setStatus('', '⟳ 同步中…');
  const t = setTimeout(() => setStatus('err', '✕ 超過 10 秒仍未收到雲端確認：請確認 Firestore 資料庫已建立、網路未擋 Firebase、並關閉廣告攔截器'), 10000);
  return p.then(() => { clearTimeout(t); syncErr = false; setStatus('ok', '● 已同步至雲端'); })
          .catch(e => { clearTimeout(t); errMsg(e); });
}

// ---------- 寫入（用 merge，避免整份覆蓋其他裝置的資料） ----------
const saveConfigDoc = () => write(setDoc(dbRef, { config }, { merge:true }));
const saveClasses   = () => write(setDoc(dbRef, { classes }, { merge:true }));
const saveRecord    = (key, rec) => write(setDoc(dbRef, { records:{ [key]: rec } }, { merge:true }));

// ---------- 即時監聽 ----------
onSnapshot(dbRef, { includeMetadataChanges:true }, snap => {
  if (snap.exists()) {
    const d = snap.data();
    config = { startDate:'', examDate:'', holidays:[], ...(d.config||{}) };
    config.holidays = config.holidays || [];
    classes = d.classes || [];
    records = d.records || {};
  }
  if (!syncErr) {
    if (snap.metadata.hasPendingWrites) setStatus('', '⟳ 同步中…');
    else if (snap.metadata.fromCache) setStatus('', '○ 離線模式（連線後自動同步）');
    else setStatus('ok', '● 已同步至雲端');
  }

  $('startDate').value = config.startDate || '';
  $('examDate').value = config.examDate || '';
  renderHolidays();
  if (openEdits.size) pendingRender = true;   // 編輯中不重繪，避免遺失輸入
  else renderTimetables();
}, errMsg);

// ---------- 設定 ----------
window.saveConfig = () => {
  config.startDate = $('startDate').value;
  config.examDate = $('examDate').value;
  saveConfigDoc();
};
window.addHoliday = () => {
  const date = $('holidayInput').value;
  if (!date) return;
  const reason = $('holidayReason').value.trim() || '停課 / 放假';
  const h = config.holidays.find(x => x.date === date);
  if (h) h.reason = reason; else config.holidays.push({ date, reason });
  config.holidays.sort((a,b) => a.date.localeCompare(b.date));
  $('holidayInput').value = ''; $('holidayReason').value = '';
  saveConfigDoc(); renderHolidays(); renderTimetables();
};
window.removeHoliday = date => {
  config.holidays = config.holidays.filter(h => h.date !== date);
  saveConfigDoc(); renderHolidays(); renderTimetables();
};
function renderHolidays(){
  $('holidayList').innerHTML = config.holidays.map(h =>
    `<span class="holiday-tag">${esc(h.date)} (<b>${esc(h.reason)}</b>)<span class="x" onclick="removeHoliday('${esc(h.date)}')">×</span></span>`).join('');
}

// ---------- 班級 ----------
$('dayBox').innerHTML = [1,2,3,4,5,6,0].map(d =>
  `<div class="day-row"><label><input type="checkbox" class="day-cb" value="${d}"> 星期${dayNames[d]}</label><input type="text" class="day-note" id="note_${d}" placeholder="備註 (如: 第3節)"></div>`).join('');

function resetForm(){
  $('className').value = '';
  document.querySelectorAll('.day-cb').forEach(c => c.checked = false);
  document.querySelectorAll('.day-note').forEach(i => i.value = '');
}
window.submitClass = () => {
  const name = $('className').value.trim();
  const schedule = [];
  document.querySelectorAll('.day-cb').forEach(cb => {
    if (cb.checked) schedule.push({ day: +cb.value, note: $('note_' + cb.value).value.trim() });
  });
  if (!name || !schedule.length) return alert('請輸入班級名稱，並至少勾選一天上課日。');

  if (editingClassId) {
    const c = classes.find(c => c.id === editingClassId);
    if (c) { c.name = name; c.schedule = schedule; }
    expanded.add(editingClassId);
    cancelEdit();
  } else {
    const id = Date.now().toString();
    classes.push({ id, name, schedule });
    expanded.add(id);
    resetForm();
  }
  saveClasses(); renderTimetables();
};
window.editClass = id => {
  const c = classes.find(c => c.id === id); if (!c) return;
  editingClassId = id; resetForm();
  $('className').value = c.name;
  c.schedule.forEach(s => { document.querySelector(`.day-cb[value="${s.day}"]`).checked = true; $('note_'+s.day).value = s.note || ''; });
  const b = $('submitClassBtn');
  b.textContent = '儲存修改'; b.style.cssText = 'flex:1;padding:12px;background:var(--wrn);color:#000;border-color:var(--wrn)';
  $('cancelEditBtn').style.display = 'inline-block';
  $('editorCard').scrollIntoView({ behavior:'smooth', block:'center' });
};
window.cancelEdit = () => {
  editingClassId = null; resetForm();
  const b = $('submitClassBtn');
  b.textContent = '+ 新增班級'; b.style.cssText = 'flex:1;padding:12px';
  $('cancelEditBtn').style.display = 'none';
};
window.removeClass = async id => {
  if (!confirm('確定要刪除此班級與所有進度紀錄嗎？資料將無法還原。')) return;
  classes = classes.filter(c => c.id !== id);
  expanded.delete(id);
  if (editingClassId === id) cancelEdit();
  // 一併清除該班級的進度紀錄
  const upd = {};
  Object.keys(records).filter(k => k.startsWith(id + '_')).forEach(k => { upd['records.' + k] = deleteField(); delete records[k]; });
  await saveClasses();
  if (Object.keys(upd).length) write(updateDoc(dbRef, upd));
  renderTimetables();
};
window.toggleClass = (id, e) => {
  if (e.target.closest('button')) return;
  const w = $('wrap-' + id), open = w.style.display === 'none';
  w.style.display = open ? 'block' : 'none';
  $('ico-' + id).textContent = open ? '▼' : '▶';
  open ? expanded.add(id) : expanded.delete(id);
};
window.togglePast = id => {
  const b = $('past-' + id), open = b.style.display === 'none';
  b.style.display = open ? '' : 'none';
  $('pico-' + id).textContent = open ? '▼' : '▶';
  open ? expandedPast.add(id) : expandedPast.delete(id);
};

// ---------- 進度紀錄（單格編輯） ----------
const cellKey = (c, d, f) => `${c}_${d}_${f}`;
window.enterEdit = (c, d, f) => {
  const k = cellKey(c,d,f);
  $('view_'+k).style.display = 'none'; $('edit_'+k).style.display = 'block';
  $('input_'+k).focus(); openEdits.add(k);
};
function closeEdit(c, d, f){
  const k = cellKey(c,d,f);
  $('edit_'+k).style.display = 'none'; $('view_'+k).style.display = 'block';
  openEdits.delete(k);
  if (!openEdits.size && pendingRender) { pendingRender = false; renderTimetables(); }
}
window.cancelCell = (c, d, f) => {
  $('input_'+cellKey(c,d,f)).value = (records[`${c}_${d}`] || {})[f] || '';
  closeEdit(c, d, f);
};
window.saveCell = (c, d, f) => {
  const key = `${c}_${d}`;
  const val = $('input_'+cellKey(c,d,f)).value;
  records[key] = { expected:'', actual:'', ...(records[key]||{}), [f]: val };
  $('view_'+cellKey(c,d,f)).querySelector('.content-display').innerHTML =
    val.trim() ? esc(val) : '<span style="color:var(--mut)">[ EMPTY ]</span>';
  saveRecord(key, records[key]);
  closeEdit(c, d, f);
};
function cellHTML(cId, dateStr, f, ph){
  const k = cellKey(cId, dateStr, f);
  const val = (records[`${cId}_${dateStr}`] || {})[f] || '';
  return `
  <div id="view_${k}">
    <div class="content-display">${val.trim() ? esc(val) : '<span style="color:var(--mut)">[ EMPTY ]</span>'}</div>
    <div class="r"><button class="btn-sm btn-edit" onclick="enterEdit('${cId}','${dateStr}','${f}')">✏️ EDIT</button></div>
  </div>
  <div id="edit_${k}" style="display:none">
    <textarea id="input_${k}" class="input-seamless" placeholder="${ph}">${esc(val)}</textarea>
    <div class="r"><button class="btn-sm btn-cancel" onclick="cancelCell('${cId}','${dateStr}','${f}')">CANCEL</button>
    <button class="btn-sm" onclick="saveCell('${cId}','${dateStr}','${f}')">💾 SAVE</button></div>
  </div>`;
}

// ---------- 課表 ----------
function getClassDates(schedule){
  if (!config.startDate || !config.examDate) return [];
  const [sy,sm,sd] = config.startDate.split('-').map(Number);
  const [ey,em,ed] = config.examDate.split('-').map(Number);
  const cur = new Date(sy, sm-1, sd), end = new Date(ey, em-1, ed), out = [];
  while (cur <= end) {
    const s = schedule.find(x => x.day === cur.getDay());
    if (s) {
      const dateStr = fmt(cur), h = config.holidays.find(x => x.date === dateStr);
      out.push({ dateStr, day:cur.getDay(), note:s.note, isHoliday:!!h, reason:h ? h.reason : '' });
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}
function rowHTML(cd, c, today){
  const past = cd.dateStr < today;
  const date = cd.dateStr.substring(5).replace('-','/') + ` (星期${dayNames[cd.day]})`;
  const note = cd.note ? `<br><span class="cell-note">${esc(cd.note)}</span>` : '';
  if (cd.isHoliday) return `<tr class="row-holiday"><td class="date-cell ${past?'date-past':''}"><del>${date}</del><span class="tag-off">OFF</span>${note}</td>
    <td colspan="2" style="text-align:center;color:var(--dng);font-weight:bold;vertical-align:middle">[ ${esc(cd.reason)} ]</td></tr>`;
  return `<tr><td class="date-cell ${past?'date-past':''}">${date}${cd.dateStr===today?' <span class="badge" style="padding:0 6px;font-size:11px">TODAY</span>':''}${note}</td>
    <td>${cellHTML(c.id, cd.dateStr, 'actual', '輸入實際完成進度...')}</td>
    <td>${cellHTML(c.id, cd.dateStr, 'expected', '輸入預期課程進度...')}</td></tr>`;
}
function renderTimetables(){
  const box = $('timetablesContainer');
  if (!config.startDate || !config.examDate)
    return box.innerHTML = '<div class="card" style="border:1px dashed var(--dng);text-align:center;color:var(--dng);font-weight:bold">[!] 請先設定「紀錄起始日」與「下次段考日」</div>';
  if (!classes.length)
    return box.innerHTML = '<div class="card" style="text-align:center;color:var(--mut)">[ 資料庫為空 ] 尚未登錄任何班級</div>';

  const today = fmt(new Date());
  box.innerHTML = classes.map(c => {
    const dates = getClassDates(c.schedule);
    const remain = dates.filter(d => d.dateStr >= today && !d.isHoliday).length;
    const skipped = dates.filter(d => d.isHoliday).length;
    const open = expanded.has(c.id), pOpen = expandedPast.has(c.id);
    const upcoming = dates.filter(d => d.dateStr >= today);
    const past = dates.filter(d => d.dateStr < today).reverse();
    const summary = c.schedule.map(s => `星期${dayNames[s.day]}${s.note ? ' ['+esc(s.note)+']' : ''}`).join('、');

    let body = dates.length ? '' : '<tr><td colspan="3" style="text-align:center;color:var(--mut);padding:30px">[ NO DATA ] 此區間內沒有排定課程</td></tr>';
    body += upcoming.length ? upcoming.map(d => rowHTML(d, c, today)).join('')
      : (dates.length ? '<tr><td colspan="3" style="text-align:center;color:var(--wrn);font-weight:bold">[ ALL CLEARED ] 已無未來課程</td></tr>' : '');
    if (past.length) body += `
      <tr class="past-divider" onclick="togglePast('${c.id}')"><td colspan="3"><span id="pico-${c.id}" class="ico">${pOpen?'▼':'▶'}</span> 歷史紀錄 [ ${past.length} 筆 ]</td></tr>
      </tbody><tbody id="past-${c.id}" style="display:${pOpen?'':'none'}">${past.map(d => rowHTML(d, c, today)).join('')}`;

    return `<div class="class-timetable">
      <div class="class-header" onclick="toggleClass('${c.id}',event)">
        <div><h3><span id="ico-${c.id}" class="ico">${open?'▼':'▶'}</span> ${esc(c.name)}</h3><div class="info">CYCLE: ${summary}</div></div>
        <div class="r"><span class="badge">REMAINING: ${remain} 節</span> <span class="badge h">SKIPPED: ${skipped} 節</span>
          <div style="margin-top:8px"><button class="btn-edit" onclick="editClass('${c.id}')">EDIT</button><button class="btn-danger" onclick="removeClass('${c.id}')">DELETE</button></div></div>
      </div>
      <div id="wrap-${c.id}" style="display:${open?'block':'none'};overflow-x:auto"><table>
        <thead><tr><th class="date-cell">DATE / 日期</th><th>✅ ACTUAL / 實際進度</th><th>🎯 TARGET / 預期進度</th></tr></thead>
        <tbody>${body}</tbody></table></div></div>`;
  }).join('');
}
</script>
</body>
</html>
